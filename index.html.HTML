<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Jugar con Crommi - Crommia</title>
    <style>
        /* Tipografías locales según manual de marca */
        @font-face {
            font-family: 'Brownist';
            src: url('Brownist.otf') format('opentype'), url('Brownist.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'DK Lemon Yellow Sun';
            src: url('DK Lemon Yellow Sun.otf') format('opentype'), url('DK Lemon Yellow Sun.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --brand-blue: #70C5F4;
            --brand-orange: #F58A27;
            --brand-yellow: #FDE396;
            --brand-purple: #C064A6;
            --brand-green: #7AC142;
            --brand-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DK Lemon Yellow Sun', sans-serif;
            background-color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--brand-blue);
        }

        header {
            text-align: center;
            padding: 20px 10px 10px;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        h1 {
            font-family: 'Brownist', sans-serif;
            color: var(--brand-orange);
            font-size: 2.8rem; 
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white, 4px 4px 0px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }

        .stat-box {
            background-color: white;
            color: var(--brand-dark);
            font-size: 1.4rem;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 3px solid var(--brand-yellow);
        }

        .stat-value {
            color: var(--brand-orange);
            font-weight: bold;
        }

        #game-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('fondo-parque.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        #crommi {
            position: absolute;
            width: 85px; 
            height: auto;
            cursor: pointer;
            z-index: 5;
            transition: opacity 0.1s ease-in-out, transform 0.1s ease;
            opacity: 0;
            pointer-events: none;
            transform-origin: center center; 
        }

        .camouflaged {
            filter: brightness(0.8) sepia(0.3) hue-rotate(20deg) opacity(0.75);
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 30px 20px;
            backdrop-filter: blur(8px);
        }

        #overlay.hidden { display: none; }

        #overlay h2 {
            font-family: 'Brownist', sans-serif;
            color: var(--brand-purple);
            font-size: 3.2rem;
            margin-bottom: 15px;
            line-height: 1;
        }

        #overlay p {
            font-size: 1.8rem;
            color: var(--brand-dark);
            margin-bottom: 25px;
            line-height: 1.1;
            max-width: 90%;
        }

        #result-crommi {
            width: 170px;
            height: auto;
            margin: 10px 0 20px;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.15));
        }

        #discount-badge {
            display: none;
            background-color: var(--brand-green);
            color: white;
            font-family: 'Brownist', sans-serif;
            font-size: 2.8rem;
            padding: 12px 24px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 0px #5A992E;
            transform: rotate(-4deg);
        }

        button {
            background-color: var(--brand-orange);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 2rem;
            font-family: 'Brownist', sans-serif;
            border-radius: 35px;
            box-shadow: 0 6px 0px #C96A1A;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px #C96A1A;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>CROMMIA</h1>
            <div class="stats-bar">
                <div class="stat-box">Reloj: <span id="time" class="stat-value">15</span>s</div>
                <div class="stat-box">Puntos: <span id="catches" class="stat-value">0</span></div>
            </div>
        </header>

        <div id="game-area">
            <img id="crommi" src="Crommi 2.png" alt="Crommi" draggable="false">
        </div>

        <div id="overlay">
            <h2 id="overlay-title">¡Atrapa a Crommi!</h2>
            <img src="crommi 3.png" alt="Crommi Mascota" id="result-crommi" draggable="false">
            <p id="overlay-desc">Atrápalo todas las veces que puedas en 15 segundos. <br><b>¡Cada 3 aciertos sumas 5% de descuento!</b> (Máx 30%)</p>
            <div id="discount-badge">¡20% OFF!</div>
            <button id="main-btn">¡Empezar!</button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE AUDIO ---
        const audioFondo = new Audio('musica-fondo.mp3');
        audioFondo.loop = true; // Hace que la música se repita
        audioFondo.volume = 0.4; // Volumen de fondo (0.0 a 1.0)

        const audioAtrapado = new Audio('atrapado.mp3');
        audioAtrapado.volume = 0.8;

        const audioGanar = new Audio('ganar.mp3');
        audioGanar.volume = 0.8;

        const audioPerder = new Audio('perder.mp3');
        audioPerder.volume = 0.8;
        // ------------------------------

        let timeLeft = 15;
        let catchCount = 0;
        let timerInterval;
        let moveTimeout;
        let isPlaying = false;
        let isShowingResults = false;
        
        let lastX = 50; 
        let lastY = 50;

        const timeDisplay = document.getElementById('time');
        const catchesDisplay = document.getElementById('catches');
        const crommi = document.getElementById('crommi');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const discountBadge = document.getElementById('discount-badge');
        const mainBtn = document.getElementById('main-btn');

        function getRandomPosition() {
            let newX, newY;
            let distance = 0;
            while (distance < 25) {
                newY = Math.floor(Math.random() * (82 - 35 + 1)) + 35;
                newX = Math.floor(Math.random() * (80 - 5 + 1)) + 5;
                distance = Math.sqrt(Math.pow(newX - lastX, 2) + Math.pow(newY - lastY, 2));
            }
            lastX = newX; lastY = newY;
            return { top: newY + '%', left: newX + '%' };
        }

        function showRules() {
            isShowingResults = false;
            overlayTitle.innerText = "¡Atrapa a Crommi!";
            overlayTitle.style.color = "var(--brand-purple)";
            overlayDesc.innerHTML = "Atrápalo todas las veces que puedas en 15 segundos. <br><b>¡Cada 3 aciertos sumas 5% de descuento!</b> (Máx 30%)";
            discountBadge.style.display = 'none';
            mainBtn.innerText = "¡Empezar!";
            
            // Frenar cualquier sonido de victoria/derrota que siga sonando
            audioGanar.pause();
            audioGanar.currentTime = 0;
            audioPerder.pause();
            audioPerder.currentTime = 0;

            overlay.classList.remove('hidden');
        }

        function startGame() {
            isPlaying = true;
            timeLeft = 15;
            catchCount = 0;
            timeDisplay.innerText = timeLeft;
            timeDisplay.style.color = 'var(--brand-orange)';
            catchesDisplay.innerText = catchCount;
            overlay.classList.add('hidden');
            crommi.style.pointerEvents = 'auto';

            // Iniciar música de fondo
            audioFondo.currentTime = 0;
            audioFondo.play().catch(e => console.log("Audio de fondo bloqueado temporalmente por el navegador."));

            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.innerText = timeLeft;
                if(timeLeft <= 5) timeDisplay.style.color = '#e74c3c';
                if(timeLeft <= 0) endGame();
            }, 1000);

            moveCrommi();
        }

        function moveCrommi() {
            if (!isPlaying) return;
            crommi.style.opacity = 0;
            crommi.style.pointerEvents = 'none';

            setTimeout(() => {
                if (!isPlaying) return;
                const newPos = getRandomPosition();
                crommi.style.top = newPos.top;
                crommi.style.left = newPos.left;

                let scale = lastY < 45 ? 0.7 : (lastY < 65 ? 0.85 : 1);
                const randomRotation = Math.floor(Math.random() * 50) - 25; 
                const flip = Math.random() > 0.5 ? 1 : -1;

                if(Math.random() < 0.3) crommi.classList.add('camouflaged');
                else crommi.classList.remove('camouflaged');

                crommi.style.transform = `scaleX(${flip}) scaleY(${scale}) rotate(${randomRotation}deg)`;
                crommi.style.opacity = 1;
                crommi.style.pointerEvents = 'auto';

                let minTime, maxTime;
                if (timeLeft > 10) {
                    minTime = 800; maxTime = 1200;
                } else if (timeLeft > 5) {
                    minTime = 500; maxTime = 800;
                } else {
                    minTime = 250; maxTime = 500;
                }
                
                const visibleTime = Math.random() * (maxTime - minTime) + minTime;
                moveTimeout = setTimeout(moveCrommi, visibleTime);

            }, 100); 
        }

        function handleCatch(e) {
            e.preventDefault();
            if(!isPlaying) return;
            
            // Reproducir sonido de atrapar
            audioAtrapado.currentTime = 0; // Reinicia el sonido por si se toca muy rápido
            audioAtrapado.play().catch(e => console.log("Audio atrapado no cargado."));

            catchCount++;
            catchesDisplay.innerText = catchCount;
            clearTimeout(moveTimeout);
            crommi.style.opacity = 0;
            crommi.style.pointerEvents = 'none';
            
            const respawnTime = timeLeft > 5 ? 100 : 50;
            setTimeout(moveCrommi, respawnTime);
        }

        function endGame() {
            isPlaying = false;
            isShowingResults = true;
            clearInterval(timerInterval);
            clearTimeout(moveTimeout);
            crommi.style.pointerEvents = 'none';
            crommi.style.opacity = 0;
            
            // Frenar música de fondo
            audioFondo.pause();
            
            let discount = Math.min(Math.floor(catchCount / 3) * 5, 30);
            
            if (catchCount === 0 || discount === 0) {
                // Reproducir sonido de perder/fallar
                audioPerder.currentTime = 0;
                audioPerder.play().catch(e => console.log("Audio perder no cargado."));

                if(catchCount === 0) {
                    overlayTitle.innerText = "¡Qué rápido es!";
                    overlayTitle.style.color = "var(--brand-orange)";
                    overlayDesc.innerText = "¡Mejor suerte para la próxima! No lograste atraparlo esta vez.";
                } else {
                    overlayTitle.innerText = "¡Casi!";
                    overlayTitle.style.color = "var(--brand-purple)";
                    overlayDesc.innerText = `Atrapaste a Crommi ${catchCount} veces. ¡Necesitas 3 para el descuento!`;
                }
                discountBadge.style.display = 'none';
            } else {
                // Reproducir sonido de ganar
                audioGanar.currentTime = 0;
                audioGanar.play().catch(e => console.log("Audio ganar no cargado."));

                overlayTitle.innerText = "¡Genial!";
                overlayTitle.style.color = "var(--brand-green)";
                overlayDesc.innerText = `¡Eres increíble! Atrapaste a Crommi ${catchCount} veces.`;
                discountBadge.innerText = `¡${discount}% OFF!`;
                discountBadge.style.display = 'inline-block';
            }

            mainBtn.innerText = "Continuar";
            overlay.classList.remove('hidden');
        }

        mainBtn.addEventListener('click', () => {
            if (isShowingResults) {
                showRules(); 
            } else {
                startGame(); 
            }
        });
        
        crommi.addEventListener('mousedown', handleCatch);
        crommi.addEventListener('touchstart', handleCatch, {passive: false});
    </script>
</body>
</html>
